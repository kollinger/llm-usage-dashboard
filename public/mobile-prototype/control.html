<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAN Prototype</title><link rel="stylesheet" href="/mobile-prototype/styles.css"><script src="/mobile-prototype/client.js" defer></script></head>
<body class="mobile-prototype-page" data-prototype="control"><main class="prototype-card">
<span class="prototype-tag" data-copy="prototype"></span><h1 data-copy="title"></h1><p data-copy="intro"></p>
<p class="prototype-warning" data-copy="httpWarning"></p>
<div id="prototypeQr" class="prototype-qr"></div><p data-copy="save"></p>
<label><span data-copy="address"></span><input id="prototypeUrl" readonly></label>
<button id="prototypeNewCode" type="button" data-copy="newCode"></button>
<button id="prototypeDirectCode" type="button" data-copy="directCode"></button><p data-copy="directHelp"></p>
<p id="prototypeMessage" role="status"></p><hr><h2 data-copy="network"></h2>
<p id="prototypeLeader"></p><ul id="prototypePeers"></ul>
<details><summary data-copy="joinTitle"></summary><p data-copy="joinHelp"></p>
<button id="prototypeGroupCode" type="button" data-copy="groupCode"></button>
<textarea id="prototypeGroupInvite" readonly hidden data-copy-aria="groupCode"></textarea>
<label><span data-copy="joinLabel"></span><textarea id="prototypeJoinCode" autocomplete="off" spellcheck="false"></textarea></label>
<button id="prototypeJoin" type="button" data-copy="join"></button>
</details>
<p data-copy="remote"></p><p data-copy="offline"></p>
</main></body></html>
